!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CYPRES</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#fff}header{position:fixed;top:0;left:0;right:0;height:56px;background:#000;color:#fff;display:flex;align-items:center;padding:0 16px;z-index:1000;font-weight:900}#map{position:fixed;top:56px;left:0;right:0;bottom:0}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:20px 20px 0 0;padding:18px;z-index:600;box-shadow:0 -5px 20px rgba(0,0,0,.3)}.order{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:20px 20px 0 0;padding:20px;z-index:700;display:none}.order.show{display:block}.btn{width:100%;padding:16px;border-radius:12px;border:0;font-weight:900;background:#000;color:#fff;margin-top:10px}</style></head><body><header>CYPRES UBER VALENCIA</header><div id="map"></div><div class="bottom"><b>📍 Ești ONLINE</b><div style="color:#666;font-size:12px;margin-top:4px">Harta merge acum - OpenStreetMap</div><button class="btn" onclick="comandaNoua()">🔔 TESTEAZA SUNET COMANDA</button></div><div class="order" id="ord"><div style="font-size:26px;font-weight:900">8.50 EUR 💰</div><div>Benimaclet → Ruzafa</div><div style="color:#666;font-size:13px">Client Maria ★4.9 - SUNA ACUM!</div><button class="btn" onclick="document.getElementById('ord').classList.remove('show')">✅ ACCEPTA</button></div><script>var map=L.map('map').setView([39.4699,-0.3763],15);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);var ctx=null;function beep(){try{if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();var o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=880;g.gain.value=0.5;o.connect(g);g.connect(ctx.destination);o.start();setTimeout(()=>o.stop(),400);setTimeout(()=>{var o2=ctx.createOscillator(),g2=ctx.createGain();o2.frequency.value=1320;g2.gain.value=0.5;o2.connect(g2);g2.connect(ctx.destination);o2.start();setTimeout(()=>o2.stop(),600)},500)}catch(e){}if(navigator.vibrate)navigator.vibrate([300,100,300,100,500])}function comandaNoua(){beep();document.getElementById('ord').classList.add('show');}navigator.geolocation.watchPosition(p=>{var ll=[p.coords.latitude,p.coords.longitude];L.marker(ll).addTo(map);map.setView(ll,16)},null,{enableHighAccuracy:true});</script></body></html>
