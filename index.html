<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CYPRES</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#000}header{position:fixed;top:0;left:0;right:0;height:56px;background:#000;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 16px;z-index:1000}.avatar{width:38px;height:38px;border-radius:50%;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;font-weight:900;overflow:hidden;border:2px solid #fff}#map{position:fixed;top:56px;left:0;right:0;bottom:0}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:24px 24px 0 0;padding:20px;z-index:600}.btn{width:100%;padding:18px;border-radius:12px;border:0;font-weight:900;background:#000;color:#fff}#profilePanel{position:fixed;top:0;right:-100%;width:100%;max-width:400px;height:100%;background:#fff;z-index:9999;transition:.35s}#profilePanel.open{right:0}#overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:9998}#overlay.show{display:block}</style></head><body><header><b>CYPRES</b><div class="avatar" id="avTop" onclick="openP()">C</div></header><div id="map"></div><div class="bottom"><b>📍 ONLINE Valencia</b><p style="color:#666;font-size:12px;margin-top:6px">Mapa incorporata LIVE ca la Uber</p><button class="btn" style="margin-top:12px" onclick="alert('Caut comenzi...')">CAUTA COMENZI</button></div><div id="overlay" onclick="closeP()"></div><div id="profilePanel"><div style="background:#000;color:#fff;padding:16px"><span onclick="closeP()">←</span> PROFIL</div><div style="padding:20px;text-align:center"><div class="avatar" id="av" style="width:90px;height:90px;margin:0 auto;background:#000;color:#fff;font-size:32px" onclick="document.getElementById('file').click()">C</div><input type="file" id="file" hidden accept="image/*"><h2 id="nV">Curier</h2></div><div style="padding:16px"><input id="nume" placeholder="Nume" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:8px"><button class="btn" style="margin-top:10px" onclick="save()">SALVEAZA</button></div></div><script>var map=L.map('map').setView([39.4699,-0.3763],14);L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);var me=null;function openP(){document.getElementById('profilePanel').classList.add('open');document.getElementById('overlay').classList.add('show')}function closeP(){document.getElementById('profilePanel').classList.remove('open');document.getElementById('overlay').classList.remove('show')}function save(){var n=document.getElementById('nume').value||'Curier';localStorage.setItem('nume',n);document.getElementById('nV').innerText=n;document.getElementById('avTop').innerText=n[0];document.getElementById('av').innerText=n[0];closeP();}function upd(d){var a=document.getElementById('av');a.innerHTML='';var im=document.createElement('img');im.src=d;im.style.width='100%';im.style.height='100%';im.style.objectFit='cover';a.appendChild(im);var b=document.getElementById('avTop');b.innerHTML='';var im2=document.createElement('img');im2.src=d;im2.style.width='100%';im2.style.height='100%';im2.style.objectFit='cover';b.appendChild(im2);localStorage.setItem('poza',d);}document.getElementById('file').onchange=function(e){var f=e.target.files[0];var r=new FileReader();r.onload=function(ev){upd(ev.target.result);};r.readAsDataURL(f);};window.onload=function(){var n=localStorage.getItem('nume');if(n){document.getElementById('nV').innerText=n;document.getElementById('avTop').innerText=n[0];document.getElementById('av').innerText=n[0];}var p=localStorage.getItem('poza');if(p)upd(p);navigator.geolocation.watchPosition(function(p){var ll=[p.coords.latitude,p.coords.longitude];if(!me){me=L.marker(ll).addTo(map);map.setView(ll,16);}else me.setLatLng(ll);},{},{enableHighAccuracy:true});};</script></body></html>
