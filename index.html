<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cypres Marketplace</title>
<style>
body{margin:0;font-family:Arial;background:#f6f6f6;padding-bottom:80px}
.head{background:white;padding:14px;font-weight:900;display:flex;justify-content:space-between;border-bottom:1px solid #eee}
.filters{background:#1a2744;color:white;padding:10px;display:flex;gap:8px;overflow:auto}
.chip{border:1px solid white;border-radius:20px;padding:7px 14px;white-space:nowrap;opacity:0.7}.chip.active{opacity:1;background:white;color:#1a2744;font-weight:bold}
.card{background:white;margin:10px;border-radius:12px;padding:12px;box-shadow:0 2px 6px #0001}
.go{background:#1a2744;color:white;width:65px;height:65px;border-radius:50%;float:right;display:flex;align-items:center;justify-content:center;font-weight:900}
.price{color:white;padding:5px 12px;border-radius:20px;font-weight:bold}
.config{background:white;margin:10px;border-radius:12px;padding:12px}
.row{display:flex;gap:12px;align-items:center}
.circle{width:36px;height:36px;border:2px solid #1a2744;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px}
.bottom{position:fixed;bottom:0;width:100%;background:white;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #ddd}
</style>
</head>
<body>
<div class="head"><span>CYPRES MARKETPLACE</span><span style="color:green;font-size:12px">● Conectado</span></div>
<div class="filters">
<div class="chip active" id="c0">0-1 km: <span id="v0">7</span>€</div>
<div class="chip" id="c1">1-2 km: <span id="v1">8</span>€</div>
<div class="chip" id="c2">2-3 km: <span id="v2">9</span>€</div>
</div>

<div id="list"></div>

<div class="config">
<b style="color:#1565c0">Tus precios - AQUI se cambian</b>
<p>0-1 km</p><div class="row"><div class="circle" onclick="change(0,-1)">-</div><h2 id="p0">7 €</h2><div class="circle" onclick="change(0,1)">+</div></div>
<p>1-2 km</p><div class="row"><div class="circle" onclick="change(1,-1)">-</div><h2 id="p1">8 €</h2><div class="circle" onclick="change(1,1)">+</div></div>
<p>2-3 km</p><div class="row"><div class="circle" onclick="change(2,-1)">-</div><h2 id="p2">9 €</h2><div class="circle" onclick="change(2,1)">+</div></div>
<p>€/km extra</p><div class="row"><div class="circle" onclick="change(3,-0.1)">-</div><h2 id="p3">0.8 €</h2><div class="circle" onclick="change(3,0.1)">+</div></div>
</div>

<div class="bottom"><div><b>🏠 Marketplace</b></div><div>👤 Cuenta</div></div>

<script>
let prices = [7,8,9,0.8];
function change(i,d){
 prices[i]=parseFloat((prices[i]+d).toFixed(1));
 if(prices[i]<0.1) prices[i]=0.1;
 document.getElementById('p'+i).innerText = prices[i]+' €';
 if(i<3){
   document.getElementById('v'+i).innerText = prices[i];
   document.getElementById('p'+i).style.color='green';
   setTimeout(()=>document.getElementById('p'+i).style.color='black',300);
 }
 localStorage.setItem('cypres_prices',JSON.stringify(prices));
 render();
}
function render(){
 let list = document.getElementById('list');
 let html='';
 // Aici calculam pretul real in functie de ce ai setat tu
 let pedidos = [
   {name:'PIZZERÍA CARLOS VALENCIA I', dist:0.7, km:1.2},
   {name:'BURGER KING CENTRO', dist:1.4, km:2.5},
   {name:'MCDONALDS HUELIN - MALAGA', dist:2.2, km:4.9},
 ];
 pedidos.forEach(p=>{
   let base = p.dist<1?prices[0]:p.dist<2?prices[1]:prices[2];
   let total = (base + p.km*prices[3]).toFixed(2);
   let color = total>=7?'#27ae60':'#e74c3c';
   html+=`<div class="card"><div class="go">GO!</div><b>${p.name}</b><br><small>a ${p.dist}km de ti - ${p.km} km entrega</small><br><br><span class="price" style="background:${color}">${total}€</span><br><br><small>Tu precio minimo: ${base}€ + ${prices[3]}€/km</small></div>`;
 });
 list.innerHTML=html;
}
// incarca salvate
let saved = localStorage.getItem('cypres_prices');
if(saved){prices=JSON.parse(saved); for(let i=0;i<4;i++)document.getElementById('p'+i).innerText=prices[i]+' €'; for(let i=0;i<3;i++)document.getElementById('v'+i).innerText=prices[i];}
render();
</script>
</body>
</html>
