<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cypres App</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
header{background:#000;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:20px}
.avatar{width:38px;height:38px;border-radius:50%;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;font-weight:bold;cursor:pointer;overflow:hidden}
#map{height:45vh;width:100%}
.card{background:#fff;margin:12px;border-radius:14px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.btn{width:100%;padding:14px;border:0;border-radius:10px;font-weight:bold;margin-top:10px}
.green{background:#000;color:#fff}
input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin:6px 0 12px}
label{font-size:11px;font-weight:bold;color:#666}
#profilePanel{position:fixed;top:0;right:-100%;width:100%;max-width:380px;height:100%;background:#f5f5f5;z-index:9999;transition:.3s;overflow-y:auto}
#profilePanel.open{right:0}
#overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);display:none;z-index:9998}
#overlay.show{display:block}
</style>
</head>
<body>
<header><b>CYPRES</b><div class="avatar" id="avTop" onclick="openProfile()">C</div></header>
<div id="map"></div>
<div class="card"><b>📍 COMANDĂ NOUĂ</b><p id="status" style="margin-top:8px;color:green">Ești ONLINE • Valencia</p><button class="btn green">CAUTĂ COMENZI</button></div>
<div id="overlay" onclick="closeProfile()"></div>
<div id="profilePanel">
<header><a onclick="closeProfile()" style="color:#fff;cursor:pointer">← ÎNAPOI</a><b>PROFIL</b></header>
<div class="card" style="text-align:center">
<div class="avatar" id="av" style="width:80px;height:80px;margin:0 auto;font-size:32px;background:#000;color:#fff" onclick="document.getElementById('file').click()">C</div>
<input type="file" id="file" hidden accept="image/*">
<h2 id="numeView" style="margin-top:10px">Nume Curier</h2>
<p style="color:green">● Online</p>
<p style="font-size:11px;color:#888;margin-top:5px">Apasă pe cerc pentru poză</p>
</div>
<div class="card">
<label>NUME COMPLET</label><input id="nume" placeholder="Ex: Călin Nacu">
<label>TELEFON</label><input id="tel" placeholder="+34...">
<label>VEHICUL</label><select id="veh"><option>MOTOR</option><option>BICICLETA</option><option>MASINA</option><option>PE JOS</option></select>
<label>ZONA VALENCIA</label><select id="zona"><option>BENIMACLET</option><option>CENTRO</option><option>RUZAFA</option><option>CAMINS</option><option>TOATA VALENCIA</option></select>
<label>NUMAR INMATRICULARE</label><input id="numar" placeholder="Ex: 1234 ABC">
<button class="btn green" onclick="save();closeProfile()">SALVEAZĂ</button>
</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var map = L.map('map').setView([39.4699,-0.3763],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
function openProfile(){document.getElementById('profilePanel').classList.add('open');document.getElementById('overlay').classList.add('show')}
function closeProfile(){document.getElementById('profilePanel').classList.remove('open');document.getElementById('overlay').classList.remove('show')}
function save(){
let n=document.getElementById('nume').value||'Nume Curier';
localStorage.setItem('nume',n);
localStorage.setItem('tel',document.getElementById('tel').value);
document.getElementById('numeView').innerText=n;
if(!localStorage.getItem('pozaProfil')){
document.getElementById('avTop').innerText=n[0];
document.getElementById('av').innerText=n[0];
}
alert('Salvat!');
}
document.getElementById('file').onchange = function(e){
let file = e.target.files[0];
if(!file) return;
let reader = new FileReader();
reader.onload = function(ev){
let imgData = ev.target.result;
document.getElementById('av').innerHTML = `<img src="${imgData}" style="width:100%;height:100%;object-fit:cover">`;
document.getElementById('avTop').innerHTML = `<img src="${imgData}" style="width:100%;height:100%;object-fit:cover">`;
localStorage.setItem('pozaProfil', imgData);
}
reader.readAsDataURL(file);
}
window.onload=()=>{
let n=localStorage.getItem('nume');
if(n){document.getElementById('nume').value=n;document.getElementById('numeView').innerText=n;if(!localStorage.getItem('pozaProfil')){document.getElementById('avTop').innerText=n[0];document.getElementById('av').innerText=n[0];}}
let poza=localStorage.getItem('pozaProfil');
if(poza){
document.getElementById('av').innerHTML = `<img src="${poza}" style="width:100%;height:100%;object-fit:cover">`;
document.getElementById('avTop').innerHTML = `<img src="${poza}" style="width:100%;height:100%;object-fit:cover">`;
}
}
</script>
</body>
</html>
