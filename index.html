<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CYPRES VALENCIA</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>*{margin:0;box-sizing:border-box}body{font-family:sans-serif;background:#111;color:#fff}#map{height:50vh}header{background:#0f3d2e;padding:12px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:999}.order{background:#222;margin:8px;border-radius:14px;padding:12px;border-left:4px solid #ffcc00}.btn{flex:1;padding:11px;border-radius:10px;border:0;font-weight:900}.green{background:#25D366;color:#fff}.dark{background:#444;color:#fff}.row{display:flex;gap:6px;margin-top:8px}.test{background:#ffcc00;color:#000;text-align:center;padding:14px;font-weight:900;position:fixed;bottom:0;left:0;right:0}</style></head><body><header><b>CYPRES VALENCIA 🛵</b><span style="color:#25D366">● ONLINE</span></header><div id="map"></div><div id="list"></div><div class="test" onclick="newOrder()">🔔 TEST SUNET UBER - APASA</div><script>let orders=[{id:1023,client:"Mihai - Colon 12",addr:"Carrer Colon 12, Valencia",lat:39.4699,lng:-0.3763,total:"18€",status:"new"},{id:1024,client:"Ana - Puerto 45",addr:"Av del Puerto 45",lat:39.466,lng:-0.355,total:"15€",status:"new"}];let map=L.map('map').setView([39.4699,-0.3763],14);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);let m={};function play(){try{let c=new(window.AudioContext||window.webkitAudioContext)();let t=c.currentTime;for(let i=0;i<3;i++){let o=c.createOscillator();let g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=i%2==0?880:1320;g.gain.setValueAtTime(1,t+i*0.25);g.gain.exponentialRampToValueAtTime(0.01,t+i*0.25+0.2);o.start(t+i*0.25);o.stop(t+i*0.25+0.3)}navigator.vibrate&&navigator.vibrate([200,100,200,100,400])}catch(e){}}function render(){let h="";orders.forEach(o=>{if(!m[o.id])m[o.id]=L.marker([o.lat,o.lng]).addTo(map).bindPopup(o.addr);let n=o.status=="new";h+=`<div class="order" onclick="map.setView([${o.lat},${o.lng}],16)"><b>#${o.id} ${o.total} ${n?"🟡 NOUA":"🟢 CURS"}</b><div style="font-size:11px;color:#aaa">${o.addr}</div><div class="row">${n?`<button class="btn dark" onclick="orders=orders.filter(x=>x.id!=${o.id});render()">X</button><button class="btn green" onclick="orders.find(x=>x.id==${o.id}).status='picked';render()">ACCEPTA</button>`:`<button class="btn dark" onclick="window.open('https://waze.com/ul?ll=${o.lat},${o.lng}&navigate=yes')">WAZE</button><button class="btn green" onclick="map.removeLayer(m[${o.id}]);orders=orders.filter(x=>x.id!=${o.id});render()">LIVRAT</button>`}</div></div>`});document.getElementById('list').innerHTML=h}function newOrder(){let id=Math.floor(Math.random()*9000);orders.unshift({id:id,client:"Client Nou",addr:"Plaza Ayuntamiento",lat:39.4696,lng:-0.3766,total:"19€",status:"new"});render();play()}render()</script></body></html>
